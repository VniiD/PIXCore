name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: ledger_owner, POSTGRES_PASSWORD: ci-ephemeral, POSTGRES_DB: ledger }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger_owner" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./... && test -z "$(gofmt -l .)"
      - run: go test -race -count=1 ./...
        env:
          PIXCORE_TEST_DATABASE_URL: postgres://ledger_owner:ci-ephemeral@127.0.0.1:5432/ledger?sslmode=disable
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet -exclude-generated ./...
      - name: gitleaks (histórico completo)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: build da imagem
        run: docker build -f deploy/ledger/Dockerfile -t pixcore/ledger-service:ci .
      - name: trivy (imagem)
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "pixcore/ledger-service:ci", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
